# Builds the extension on a v* tag and attaches the vsix to a GitHub release.
#
#   npm version minor && git push --follow-tags
#
# It deliberately does NOT publish to the Marketplace: releases are uploaded by
# hand at https://marketplace.visualstudio.com/manage/publishers/akotrulev
# (the extension's own "Update" action — "New extension" is only for the first
# publish and errors with "already exists" afterwards).
#
# To automate that step later, add a repository secret VSCE_PAT — an Azure
# DevOps token scoped to Marketplace → Manage, all accessible organizations —
# and append:
#
#   - run: npx --yes @vscode/vsce publish --no-dependencies --packagePath plan-queue.vsix
#     env:
#       VSCE_PAT: ${{ secrets.VSCE_PAT }}
#
# Note that Azure DevOps retires global PATs on 2026-12-01; after that the
# route is a Microsoft Entra identity and `vsce publish --azure-credential`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes @vscode/vsce package --no-dependencies -o plan-queue.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: plan-queue.vsix
