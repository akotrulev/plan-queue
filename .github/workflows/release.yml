# Publishes to the VS Code Marketplace when a v* tag is pushed.
#
#   npm version minor && git push --follow-tags
#
# Needs one repository secret: VSCE_PAT — an Azure DevOps personal access token
# with Marketplace → Manage, scoped to all accessible organizations.
# OVSX_TOKEN is optional; when it is set the same build also goes to Open VSX,
# which is where Cursor, Windsurf and VSCodium look.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes @vscode/vsce package --no-dependencies -o plan-queue.vsix

      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath plan-queue.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: ${{ env.OVSX_TOKEN != '' }}
        run: npx --yes ovsx publish plan-queue.vsix
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Attach the vsix to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: plan-queue.vsix
