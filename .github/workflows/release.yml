# Publishes to the VS Code Marketplace on a push to main — but only when the
# version in package.json differs from what the Marketplace is already serving.
# So the release gesture is a version bump:
#
#   npm version patch && git push --follow-tags
#
# Every other push to main builds, typechecks and tests, then stops. This is
# deliberate: the Marketplace rejects a re-upload of a version it already has,
# so publishing on every push would fail on every push that isn't a bump.
#
# Requires one repository secret:
#   VSCE_PAT — an Azure DevOps personal access token, Organization "All
#   accessible organizations", Scopes: Marketplace → Manage.
#
#   Sign in at https://aex.dev.azure.com/me — NOT https://dev.azure.com, which
#   redirects signed-out visitors to a marketing page — and create a free
#   organization if you have none. The token page is then
#   https://dev.azure.com/<org>/_usersSettings/tokens. Store it with
#   `gh secret set VSCE_PAT`.
#
# Azure DevOps retires global PATs on 2026-12-01. After that the route is a
# Microsoft Entra identity with a federated credential trusting this repo,
# azure/login, and `vsce publish --azure-credential` in place of the env var.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes @vscode/vsce package --no-dependencies -o plan-queue.vsix

      # The Marketplace is the source of truth for what is already out there —
      # cheaper and more honest than trusting a tag to exist.
      - name: Is this version already published?
        id: check
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./package.json').version")
          published=$(curl -sS -X POST \
            https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'Accept: application/json;api-version=7.2-preview.1' \
            -H 'Content-Type: application/json' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"akotrulev.plan-queue"}]}],"flags":914}' \
            | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const x=JSON.parse(s).results[0].extensions;
                console.log(x.length ? x[0].versions[0].version : 'none');
              })")
          echo "local=$local_version"  >> "$GITHUB_OUTPUT"
          echo "published=$published"  >> "$GITHUB_OUTPUT"
          if [ "$local_version" = "$published" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$local_version is already on the Marketplace — built and tested, nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing $local_version (Marketplace has $published)"
          fi

      - name: Publish to the Marketplace
        if: steps.check.outputs.publish == 'true'
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath plan-queue.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Tag the release and attach the vsix
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.local }}
          name: v${{ steps.check.outputs.local }}
          files: plan-queue.vsix
          generate_release_notes: true
